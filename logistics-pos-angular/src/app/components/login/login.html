 <div class="login-container">
  <div class="floating-shapes">
    <div class="shape"></div><div class="shape"></div>
    <div class="shape"></div><div class="shape"></div>
  </div>

  <div class="login-card">
    <div class="login-header">
      <h1>POS System</h1>
      <p>Logistics & Production Management</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">

      <!-- Step 1: Email -->
      <div *ngIf="step === 1" class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          [disabled]="isLoading">
      </div>


      <div *ngIf="step === 2" class="form-group password-group">
    <label for="password">Password</label>
    <div class="password-input-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter password"
        required
        [disabled]="isLoading">
      
      <button type="button" class="eye-btn" (click)="togglePassword()" [disabled]="isLoading">
        <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
      </button>
    </div>
  </div>


      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          <span *ngIf="isLoading">Please wait...</span>
          <span *ngIf="!isLoading">{{ step === 1 ? 'Verify Email' : 'Login' }}</span>
        </button>
        <button *ngIf="step === 2" type="button" class="btn btn-link" (click)="showForgotPassword()">
          Forgot Password?
        </button>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
    </form>
    <div class="register-section">
      <p>Don’t have an account? 
        <a (click)="goToRegister()" class="register-link">Create Account</a>
      </p>
    </div>

  </div>
</div>
